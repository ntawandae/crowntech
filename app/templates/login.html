{% extends 'shop/base.html' %}
{% block title %}Staff sign in | {{ biz.name }}{% endblock %}
{% block content %}
<div class="wrap"><div class="panel auth-card">
  <h1 style="font-size:1.7rem">Staff sign in</h1>
  <p class="muted">For {{ biz.name }} admins and cashiers. Customers can <a href="{{ url_for('shop.account_login') }}">sign in here</a>.</p>
  <form method="post">
    <div class="field"><label for="email">Work email</label><input id="email" type="email" name="email" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required></div>
    <button class="btn btn-gold btn-block" type="submit">Sign in</button>
  </form>
</div></div>
{% endblock %}
